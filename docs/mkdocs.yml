site_name: Quark Agent
site_url: https://madapexai.github.io/quark-agent
site_description: A zero-dependency agentic framework with 22 LLM providers, 17 channels, and multi-agent orchestration.
site_author: Madapexai
repo_url: https://github.com/Madapexai/quark-agent
repo_name: Madapexai/quark-agent
edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/atom

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - What's New: changelog.md
  - Features:
      - MCP Protocol: features/mcp.md
      - RAG / Knowledge Base: features/rag.md
      - OpenAI Compatible API: features/openai-api.md
      - Workflow DAG Engine: features/workflow.md
      - Voice STT/TTS: features/voice.md
      - Cron Scheduler: features/scheduler.md
      - Multimodal Input: features/multimodal.md
      - Computer Use: features/computer-use.md
      - Function Calling: features/function-calling.md
      - Plugin Hot Reload: features/hot-reload.md
  - Concepts:
      - Kernel & Layers: concepts/kernel.md
      - Tools & Skills: concepts/tools.md
      - Channels: concepts/channels.md
      - Profiles: concepts/profiles.md
      - A2A Protocol: concepts/a2a.md
      - Self-Evolution (GEPA): concepts/gepa.md
      - Mixture of Agents (MoA): concepts/moa.md
      - Checkpoint & Long-Running: concepts/checkpoint.md
      - Sandbox Policy: concepts/sandbox-policy.md
  - Reference:
      - 22 Providers: reference/providers.md
      - 17 Channels: reference/channels.md
      - Tools: reference/tools.md
      - defineAction API: reference/define-action.md
      - Configuration: reference/config.md
      - API Endpoints: reference/api-endpoints.md
  - Benchmark:
      - Overview: benchmark/index.md
      - GAIA Results: benchmark/gaia.md
      - AgentBench Results: benchmark/agentbench.md
      - Reproduction: benchmark/reproduce.md
  - Community:
      - Contributing: community/contributing.md
      - Roadmap: community/roadmap.md
      - Rust Roadmap: community/rust-roadmap.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list

plugins:
  - search:
      lang:
        - en
        - zh

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Madapexai/quark-agent
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/
    - icon: fontawesome/brands/discord
      link: https://discord.gg/
  analytics:
    provider: google
    property: G-XXXXXXXXXX

extra_css:
  - assets/custom.css
