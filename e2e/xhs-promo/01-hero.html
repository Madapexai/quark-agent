<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Quark Agent - 小红书 01</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1440px; overflow: hidden; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; background: #0a0a0a; color: #fff; position: relative; }
.grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; }
.orb1 { position: absolute; top: -200px; right: -100px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(168,85,247,0.3) 0%, transparent 70%); filter: blur(60px); }
.orb2 { position: absolute; bottom: -150px; left: -100px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(6,182,212,0.2) 0%, transparent 70%); filter: blur(60px); }
.content { position: relative; z-index: 2; padding: 72px 64px; display: flex; flex-direction: column; height: 100%; }

/* Top badge */
.badge { display: inline-flex; align-items: center; gap: 10px; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.3); border-radius: 100px; padding: 12px 28px; font-size: 22px; color: #a855f7; font-weight: 700; width: fit-content; margin-bottom: 40px; }
.badge svg { width: 20px; height: 20px; }

/* Hook line - XHS style */
.hook { font-size: 36px; color: #f97316; font-weight: 800; margin-bottom: 24px; letter-spacing: 1px; }

/* Title */
.title { font-size: 88px; font-weight: 900; line-height: 1.05; letter-spacing: -2px; margin-bottom: 20px; }
.title .en { background: linear-gradient(135deg, #fff 30%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.title .zh { display: block; font-size: 52px; font-weight: 700; background: linear-gradient(135deg, #a855f7, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 6px; margin-top: 8px; }

/* Subtitle - XHS conversational tone */
.subtitle { font-size: 30px; color: rgba(255,255,255,0.65); line-height: 1.6; margin-bottom: 48px; max-width: 820px; }
.subtitle em { font-style: normal; color: #a855f7; font-weight: 700; }
.subtitle .hl { color: #f97316; font-weight: 700; }

/* Stats */
.stats { display: flex; gap: 24px; margin-bottom: 48px; }
.stat { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px 20px; text-align: center; flex: 1; backdrop-filter: blur(8px); }
.stat .num { font-size: 52px; font-weight: 900; background: linear-gradient(135deg, #a855f7, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.stat .label { font-size: 19px; color: rgba(255,255,255,0.45); margin-top: 2px; }

/* Features */
.features { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 48px; }
.feature { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 18px 22px; }
.feature svg { width: 26px; height: 26px; flex-shrink: 0; }
.feature span { font-size: 21px; color: rgba(255,255,255,0.85); }

/* Install */
.install { background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.25); border-radius: 16px; padding: 28px 36px; text-align: center; }
.install .label { font-size: 17px; color: rgba(255,255,255,0.4); margin-bottom: 10px; letter-spacing: 3px; }
.install code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 26px; color: #a855f7; font-weight: 600; }

/* Bottom bar with GitHub */
.bottom { position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; padding: 24px 64px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); border-top: 1px solid rgba(255,255,255,0.06); }
.gh-link { display: flex; align-items: center; gap: 10px; font-size: 20px; color: #a855f7; font-weight: 600; text-decoration: none; }
.gh-link svg { width: 22px; height: 22px; }
.page-num { font-size: 18px; color: rgba(255,255,255,0.25); }
</style>
</head>
<body>
<div class="grid-bg"></div><div class="orb1"></div><div class="orb2"></div>

    </div>
    <div class="feature">
      <svg viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      <span>GEPA 自进化</span>
    </div>
  </div>

  <div class="install">
    <div class="label">一行命令就搞定</div>
    <code>npx github:Madapexai/quark-agent setup</code>
  </div>
</div>

</body>
</html>
