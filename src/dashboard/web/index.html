<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quark-agent</title>
<style>
/* ============================================================================
   CSS 变量（暗色主题）
   ============================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #1a1a1a;
  --bg-secondary: #212121;
  --bg-tertiary: #2a2a2a;
  --bg-hover: #2d2d2d;
  --bg-active: #383838;
  --bg-sidebar: #1e1e1e;
  --bg-input: #2a2a2a;
  --bg-msg-user: #2563eb;
  --bg-msg-agent: #2a2a2a;
  --border: #333333;
  --border-light: #2a2a2a;
  --text-primary: #e5e5e5;
  --text-secondary: #a0a0a0;
  --text-tertiary: #666666;
  --accent: #ffffff;
  --blue: #60a5fa;
  --blue-hover: #93c5fd;
  --blue-bg: #1e293b;
  --green: #4ade80;
  --green-bg: #052e16;
  --orange: #fb923c;
  --red: #f87171;
  --red-bg: #450a0a;
  --yellow: #facc15;
  --purple: #a78bfa;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.4);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
  --transition: 150ms ease;
  --icon-sidebar-width: 60px;
}

html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================================
   登录页
   ============================================================================ */
#login-page {
  display: none;
  position: fixed; inset: 0;
  background: var(--bg-primary);
  z-index: 1000;
  justify-content: center; align-items: center;
}
#login-page.active { display: flex; }
.login-card {
  width: 380px; padding: 48px 36px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-md);
  text-align: center;
}
.login-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.login-card .login-sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 32px; }
.login-field {
  width: 100%; padding: 10px 14px; margin-bottom: 16px;
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md);
  color: var(--text-primary); font-family: inherit; font-size: 14px;
  outline: none; transition: var(--transition);
}
.login-field:focus { border-color: var(--blue); }
.login-btn {
  width: 100%; padding: 10px; margin-top: 8px;
  background: var(--blue); color: #fff; border: none; border-radius: var(--radius-md);
  font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: var(--transition);
}
.login-btn:hover { background: var(--blue-hover); }
.login-hint { color: var(--text-tertiary); font-size: 12px; margin-top: 16px; }
.login-error { color: var(--red); font-size: 12px; margin-top: 8px; display: none; }
.login-error.show { display: block; }
.login-toggle { color: var(--blue); cursor: pointer; font-size: 13px; margin-top: 12px; }
.login-toggle:hover { text-decoration: underline; }

/* ============================================================================
   主布局：图标侧边栏 + 内容区
   ============================================================================ */
#app {
  display: none;
  height: 100vh;
  grid-template-columns: var(--icon-sidebar-width) 1fr;
  grid-template-rows: 48px 1fr;
}
#app.active { display: grid; }

/* ---- 顶栏 ---- */
.topbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-primary);
  z-index: 20;
  height: 48px;
}
.topbar .brand { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
.topbar .spacer { flex: 1; }

/* 全局模型选择器 */
.model-selector {
  padding: 4px 10px; background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text-primary); font-family: var(--font-mono);
  font-size: 11px; cursor: pointer; outline: none; max-width: 200px;
}

/* 语言切换 */
.locale-btn {
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md);
  color: var(--text-primary); font-size: 12px; padding: 4px 8px; cursor: pointer;
  font-family: inherit; transition: var(--transition); white-space: nowrap;
}
.locale-btn:hover { background: var(--bg-hover); }

/* 用户下拉 */
.user-menu { position: relative; }
.user-avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--blue-bg);
  color: var(--blue); display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; cursor: pointer;
}
.user-dropdown {
  display: none; position: absolute; right: 0; top: 36px;
  background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-md); min-width: 140px; z-index: 50; overflow: hidden;
}
.user-dropdown.open { display: block; }
.user-dropdown-item {
  padding: 8px 14px; cursor: pointer; font-size: 13px; color: var(--text-secondary);
  transition: var(--transition);
}
.user-dropdown-item:hover { background: var(--bg-hover); color: var(--text-primary); }

/* ============================================================================
   图标侧边栏（60px）
   ============================================================================ */
.icon-sidebar {
  grid-row: 2;
  width: var(--icon-sidebar-width);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  align-items: center;
  padding: 8px 0;
  overflow: hidden;
}
.icon-nav-item {
  width: 44px; height: 44px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; transition: var(--transition);
  position: relative; margin-bottom: 2px;
}
.icon-nav-item:hover { background: var(--bg-hover); }
.icon-nav-item.active { background: var(--bg-active); }
.icon-nav-item.active::before {
  content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; background: var(--blue); border-radius: 2px;
}
/* 悬浮文字提示 */
.icon-nav-item .tooltip {
  display: none; position: absolute; left: 52px; top: 50%; transform: translateY(-50%);
  background: var(--bg-tertiary); color: var(--text-primary); font-size: 12px;
  padding: 4px 10px; border-radius: var(--radius-sm); white-space: nowrap;
  box-shadow: var(--shadow-sm); z-index: 60; pointer-events: none;
}
.icon-nav-item:hover .tooltip { display: block; }

.icon-sidebar-spacer { flex: 1; }
.icon-sidebar-version {
  font-size: 9px; color: var(--text-tertiary); writing-mode: vertical-rl;
  text-orientation: mixed; margin-top: 8px;
}

/* ============================================================================
   主内容区
   ============================================================================ */
.main-content {
  grid-row: 2;
  overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--bg-primary);
}
.view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }

/* ============================================================================
   页面 1: Chat（默认页）
   ============================================================================ */
.chat-layout { display: flex; flex: 1; overflow: hidden; }

/* 左列：Session 列表 */
.session-panel {
  width: 240px; min-width: 240px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; background: var(--bg-secondary);
  transition: margin-left 200ms ease;
}
.session-panel.collapsed { margin-left: -240px; }
.session-panel-header {
  padding: 10px 12px; border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 8px;
}
.new-chat-btn {
  flex: 1; padding: 7px 10px;
  background: var(--blue); color: #fff; border: none; border-radius: var(--radius-md);
  font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 6px; justify-content: center;
  transition: var(--transition);
}
.new-chat-btn:hover { background: var(--blue-hover); }
.toggle-session-btn {
  width: 28px; height: 28px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-tertiary); color: var(--text-secondary); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  transition: var(--transition);
}
.toggle-session-btn:hover { background: var(--bg-hover); }

.session-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.session-list::-webkit-scrollbar { width: 4px; }
.session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.session-group-label {
  padding: 8px 12px 4px; font-size: 10px; font-weight: 600; text-transform: uppercase;
  color: var(--text-tertiary); letter-spacing: 0.05em;
}
.session-item {
  padding: 8px 12px; cursor: pointer; transition: var(--transition);
  border-left: 3px solid transparent; display: flex; align-items: center; gap: 8px;
}
.session-item:hover { background: var(--bg-hover); }
.session-item.active { background: var(--bg-active); border-left-color: var(--blue); }
.session-item .s-info { flex: 1; min-width: 0; }
.session-item .s-title {
  font-size: 13px; font-weight: 500; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.session-item .s-preview {
  font-size: 11px; color: var(--text-tertiary); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.session-item .s-model-badge {
  font-size: 9px; padding: 1px 5px; border-radius: 999px; background: var(--blue-bg);
  color: var(--blue); font-family: var(--font-mono); white-space: nowrap;
}
.session-item .s-actions { display: none; gap: 4px; }
.session-item:hover .s-actions { display: flex; }
.s-action-btn {
  width: 20px; height: 20px; border: none; background: none; color: var(--text-tertiary);
  cursor: pointer; font-size: 12px; border-radius: 3px; display: flex; align-items: center;
  justify-content: center;
}
.s-action-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }

/* 右列：消息流 */
.chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.chat-header {
  padding: 10px 16px; border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 10px;
}
.chat-header .chat-model-badge {
  padding: 2px 8px; background: var(--blue-bg); color: var(--blue);
  border-radius: 999px; font-size: 10px; font-family: var(--font-mono);
}
.chat-header .chat-tokens { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); }

.chat-messages { flex: 1; overflow-y: auto; padding: 16px; }
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.msg {
  max-width: 80%; margin-bottom: 14px; padding: 10px 14px;
  border-radius: var(--radius-lg); line-height: 1.6; position: relative;
  animation: msgIn 200ms ease;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg.user {
  margin-left: auto; background: var(--bg-msg-user); color: #fff;
  border-bottom-right-radius: var(--radius-sm);
}
.msg.agent {
  margin-right: auto; background: var(--bg-msg-agent);
  border-bottom-left-radius: var(--radius-sm);
}
.msg .msg-role {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-tertiary); margin-bottom: 4px;
}
.msg.user .msg-role { color: rgba(255,255,255,0.6); }
.msg .msg-content { font-size: 14px; word-break: break-word; }
.msg .msg-content pre {
  background: #111; color: #e5e5e5; padding: 12px; border-radius: var(--radius-md);
  overflow-x: auto; font-family: var(--font-mono); font-size: 12px; margin: 8px 0;
}
.msg .msg-content code {
  font-family: var(--font-mono); font-size: 12px; background: rgba(0,0,0,0.2);
  padding: 1px 5px; border-radius: 3px;
}
.msg .msg-content pre code { background: none; padding: 0; }
.msg .msg-content p { margin: 4px 0; }
.msg .msg-content ul, .msg .msg-content ol { padding-left: 20px; margin: 4px 0; }
.msg .msg-content blockquote {
  border-left: 3px solid var(--text-tertiary); padding-left: 10px; margin: 6px 0;
  color: var(--text-secondary);
}

/* 工具调用可折叠 */
.tool-call {
  margin: 8px 0; border: 1px solid var(--border); border-radius: var(--radius-md);
  overflow: hidden; max-width: 100%;
}
.tool-call-header {
  padding: 6px 10px; background: var(--bg-tertiary); cursor: pointer;
  font-size: 12px; font-family: var(--font-mono); color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px;
}
.tool-call-header .arrow { transition: transform 150ms; display: inline-block; }
.tool-call.open .arrow { transform: rotate(90deg); }
.tool-call-body { display: none; padding: 8px 10px; font-size: 12px; font-family: var(--font-mono); overflow-x: auto; }
.tool-call.open .tool-call-body { display: block; }

/* 输入区 */
.chat-input-area {
  padding: 10px 16px; border-top: 1px solid var(--border-light);
  display: flex; gap: 8px; align-items: flex-end;
}
.chat-input {
  flex: 1; padding: 8px 12px; min-height: 38px; max-height: 180px;
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-lg);
  color: var(--text-primary); font-family: inherit; font-size: 14px; line-height: 1.5;
  resize: none; outline: none; transition: var(--transition);
}
.chat-input:focus { border-color: var(--blue); }
.chat-send-btn {
  padding: 8px 14px; background: var(--blue); color: #fff; border: none;
  border-radius: var(--radius-lg); font-family: inherit; font-size: 13px;
  font-weight: 600; cursor: pointer; transition: var(--transition);
  display: flex; align-items: center; gap: 4px;
}
.chat-send-btn:hover { background: var(--blue-hover); }
.chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.chat-input-row { display: flex; gap: 8px; align-items: flex-end; width: 100%; }
.chat-attachments-preview { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chat-attachments-preview.drag-over { outline: 2px dashed var(--blue); outline-offset: 2px; }
.chat-input-area.drag-over { background: var(--bg-input); }
.chat-upload-btn {
  flex: 0 0 auto; width: 38px; height: 38px; padding: 0;
  background: var(--bg-secondary); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  font-size: 18px; cursor: pointer; transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.chat-upload-btn:hover { background: var(--bg-input); color: var(--blue); border-color: var(--blue); }
.chat-upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.chat-attachment-thumb, .chat-attachment-chip {
  position: relative; display: flex; align-items: center; gap: 6px;
  padding: 4px 8px; background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-md); font-size: 12px; color: var(--text-secondary); max-width: 220px;
}
.chat-attachment-thumb { padding: 4px; }
.chat-attachment-thumb img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
.chat-attachment-thumb .att-name, .chat-attachment-chip .att-name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px;
}
.att-icon { font-size: 16px; }
.att-size { color: var(--text-tertiary); font-size: 11px; }
.att-remove {
  position: absolute; top: -6px; right: -6px; width: 18px; height: 18px;
  border-radius: 50%; border: none; background: var(--danger, #e5484d); color: #fff;
  font-size: 12px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.att-remove:hover { opacity: 0.85; }
.msg-attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg-attachments .chat-attachment-thumb img { width: 80px; height: 80px; }
.stream-cursor { display: inline-block; width: 7px; height: 1em; background: var(--blue); margin-left: 2px; vertical-align: text-bottom; animation: caret-blink 1s step-end infinite; }
@keyframes caret-blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
.tool-progress {
  display: flex; align-items: center; gap: 6px; margin: 6px 0; padding: 4px 8px;
  background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: var(--radius-sm);
  font-size: 12px; color: var(--text-secondary);
}
.tool-progress .tool-icon { font-size: 13px; }
.tool-progress .tool-status { color: var(--text-tertiary); margin-left: auto; }
.tool-progress.done .tool-status { color: var(--green, #16a34a); }

/* typing 动画 */
.typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
.typing-indicator span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary);
  animation: blink 1.4s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }

/* ============================================================================
   页面 2: Dashboard
   ============================================================================ */
.dashboard-body { flex: 1; overflow-y: auto; padding: 16px; }
.dashboard-body::-webkit-scrollbar { width: 6px; }
.dashboard-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.stat-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px;
}
.stat-card {
  padding: 16px; background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-md);
}
.stat-card .stat-icon { font-size: 20px; margin-bottom: 4px; }
.stat-card .stat-value { font-size: 22px; font-weight: 700; }
.stat-card .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.stat-card .stat-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }

/* 趋势图 */
.dashboard-row { display: flex; gap: 16px; margin-bottom: 20px; }
.dashboard-row > * { flex: 1; }
.chart-card {
  padding: 16px; background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-md);
}
.chart-card .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; }
.bar-chart .bar {
  flex: 1; background: var(--blue); border-radius: 3px 3px 0 0; min-height: 4px;
  transition: height 300ms ease; position: relative;
}
.bar-chart .bar-label {
  position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
  font-size: 9px; color: var(--text-tertiary); white-space: nowrap;
}

/* 模型饼图 */
.pie-chart { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pie-legend-item { display: flex; align-items: center; gap: 4px; font-size: 12px; }
.pie-legend-color { width: 10px; height: 10px; border-radius: 2px; }

/* Item Card */
.item-card { background: var(--bg-card, #212121); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
.streaming { opacity: 0.85; border-left: 3px solid var(--blue); padding-left: 12px; }

/* Trace / Log 列表 */
.section-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.trace-item {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-secondary); margin-bottom: 6px; display: flex; align-items: center;
  gap: 10px; font-size: 12px; font-family: var(--font-mono); cursor: pointer;
  transition: var(--transition);
}
.trace-item:hover { background: var(--bg-hover); }
.trace-item .trace-status { font-size: 14px; }
.trace-item .trace-id { flex: 1; color: var(--text-secondary); }
.trace-item .trace-spans { color: var(--text-tertiary); }
.trace-item .trace-dur { color: var(--blue); }
.trace-item .trace-cost { color: var(--green); }

.log-list { font-family: var(--font-mono); font-size: 12px; }
.log-entry {
  padding: 5px 0; border-bottom: 1px solid var(--border-light);
  display: flex; gap: 10px; align-items: baseline;
}
.log-entry .log-level {
  padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; text-transform: uppercase;
}
.log-entry .log-level.info { background: var(--blue-bg); color: var(--blue); }
.log-entry .log-level.warn { background: rgba(234,179,8,0.15); color: var(--yellow); }
.log-entry .log-level.error { background: var(--red-bg); color: var(--red); }
.log-entry .log-ts { color: var(--text-tertiary); min-width: 70px; }
.log-entry .log-msg { flex: 1; word-break: break-all; }

/* ============================================================================
   页面 3: Rooms（聊天室）
   ============================================================================ */
.rooms-layout { display: flex; flex: 1; overflow: hidden; }
.rooms-panel {
  width: 220px; min-width: 220px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; background: var(--bg-secondary);
}
.rooms-panel-header {
  padding: 10px 12px; border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 8px;
}
.rooms-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.room-item {
  padding: 10px 12px; cursor: pointer; transition: var(--transition);
  border-left: 3px solid transparent; display: flex; align-items: center; gap: 8px;
}
.room-item:hover { background: var(--bg-hover); }
.room-item.active { background: var(--bg-active); border-left-color: var(--blue); }
.room-item .room-status { font-size: 10px; }
.room-item .room-name { font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.rooms-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.room-messages { flex: 1; overflow-y: auto; padding: 16px; }
.room-messages::-webkit-scrollbar { width: 6px; }
.room-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.room-msg { margin-bottom: 12px; }
.room-msg .room-msg-meta { font-size: 11px; color: var(--text-tertiary); margin-bottom: 2px; }
.room-msg .room-msg-body { font-size: 14px; padding: 8px 12px; background: var(--bg-secondary); border-radius: var(--radius-md); }
.room-msg.team-step .room-msg-body { border-left: 3px solid var(--purple); }
.room-msg.final .room-msg-body { border-left: 3px solid var(--green); }

.room-input-area {
  padding: 10px 16px; border-top: 1px solid var(--border-light);
  display: flex; gap: 8px; align-items: flex-end;
}
.room-team-bar {
  padding: 8px 16px; border-top: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-secondary);
}

/* ============================================================================
   页面 4: Skills
   ============================================================================ */
.skills-layout { display: flex; flex: 1; overflow: hidden; }
.skills-panel {
  width: 240px; min-width: 240px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; background: var(--bg-secondary);
}
.skills-panel-header {
  padding: 10px 12px; border-bottom: 1px solid var(--border-light);
  display: flex; gap: 8px;
}
.skills-search {
  flex: 1; padding: 6px 10px; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text-primary); font-family: inherit;
  font-size: 12px; outline: none;
}
.skills-search:focus { border-color: var(--blue); }
.skills-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.skill-item {
  padding: 8px 12px; cursor: pointer; transition: var(--transition);
  border-left: 3px solid transparent;
}
.skill-item:hover { background: var(--bg-hover); }
.skill-item.active { background: var(--bg-active); border-left-color: var(--blue); }
.skill-item .skill-name { font-size: 13px; font-weight: 500; }
.skill-item .skill-desc { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

.skills-detail { flex: 1; overflow-y: auto; padding: 20px; }
.skills-detail::-webkit-scrollbar { width: 6px; }
.skills-detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.skill-detail-header { margin-bottom: 20px; }
.skill-detail-header h2 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.skill-detail-header .skill-version { font-size: 12px; color: var(--text-tertiary); font-family: var(--font-mono); }
.skill-detail-header .skill-desc-text { color: var(--text-secondary); margin-top: 4px; font-size: 13px; }

.dreaming-section {
  margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
}
.dreaming-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dreaming-header h3 { font-size: 14px; font-weight: 600; }
.dreaming-stat { font-size: 11px; color: var(--text-tertiary); }
.dreaming-item {
  padding: 6px 10px; font-size: 12px; font-family: var(--font-mono);
  border-left: 2px solid var(--border); margin-bottom: 4px;
}
.dreaming-item.learn { border-left-color: var(--green); }
.dreaming-item.fail { border-left-color: var(--red); }

.dreaming-controls { display: flex; gap: 8px; margin-top: 12px; }

/* ============================================================================
   页面 5: Tools（Computer Use + Relay）
   ============================================================================ */
.tools-layout { display: flex; flex: 1; overflow: hidden; }
.tools-panel {
  width: 200px; min-width: 200px; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; background: var(--bg-secondary);
  padding: 8px 0;
}
.tools-section-label {
  padding: 8px 12px 4px; font-size: 10px; font-weight: 600; text-transform: uppercase;
  color: var(--text-tertiary); letter-spacing: 0.05em;
}
.tool-action-item {
  padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  font-size: 13px; transition: var(--transition); color: var(--text-secondary);
}
.tool-action-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.tool-action-item.active { background: var(--bg-active); color: var(--text-primary); }
.tool-action-item .tool-icon { font-size: 16px; }

.tools-detail { flex: 1; overflow-y: auto; padding: 20px; }
.tools-detail::-webkit-scrollbar { width: 6px; }
.tools-detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.screenshot-area { text-align: center; margin-bottom: 16px; }
.screenshot-area img {
  max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md);
  cursor: crosshair; background: #000;
}
.screenshot-placeholder {
  width: 100%; height: 300px; background: var(--bg-tertiary); border: 1px dashed var(--border);
  border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary); font-size: 14px;
}
.coord-input {
  display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
}
.coord-input label { font-size: 12px; color: var(--text-secondary); min-width: 50px; }
.coord-input input {
  width: 80px; padding: 4px 8px; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text-primary); font-family: var(--font-mono);
  font-size: 12px; outline: none;
}
.coord-input input:focus { border-color: var(--blue); }

.window-item {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-secondary); margin-bottom: 6px; display: flex; align-items: center;
  gap: 10px; font-size: 12px;
}
.window-item .win-name { flex: 1; }
.window-item .win-focused { color: var(--green); font-size: 10px; }

.relay-rule-item {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-secondary); margin-bottom: 6px; display: flex; align-items: center;
  gap: 10px; font-size: 12px;
}
.relay-rule-item .rule-id { flex: 1; font-family: var(--font-mono); }

/* ============================================================================
   页面 6: Settings（手风琴）
   ============================================================================ */
.settings-body-view { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; }
.settings-body-view::-webkit-scrollbar { width: 6px; }
.settings-body-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.accordion {
  border: 1px solid var(--border); border-radius: var(--radius-md);
  margin-bottom: 8px; overflow: hidden;
}
.accordion-header {
  padding: 12px 16px; background: var(--bg-secondary); cursor: pointer;
  display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500;
  transition: var(--transition); user-select: none;
}
.accordion-header:hover { background: var(--bg-hover); }
.accordion-header .acc-arrow { transition: transform 200ms; font-size: 12px; color: var(--text-tertiary); }
.accordion.open .acc-arrow { transform: rotate(90deg); }
.accordion-header .acc-icon { font-size: 16px; }
.accordion-body {
  display: none; padding: 16px; border-top: 1px solid var(--border-light);
  background: var(--bg-primary);
}
.accordion.open .accordion-body { display: block; animation: accIn 200ms ease; }
@keyframes accIn { from { opacity: 0; } to { opacity: 1; } }

/* 表单 */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary);
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;
}
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 8px 12px; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text-primary); font-family: inherit; font-size: 13px;
  outline: none; transition: var(--transition);
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--blue); }
.form-textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }
.form-switch { position: relative; width: 40px; height: 22px; display: inline-block; }
.form-switch input { opacity: 0; width: 0; height: 0; }
.form-switch .slider {
  position: absolute; inset: 0; background: var(--bg-tertiary); border-radius: 22px;
  cursor: pointer; transition: var(--transition);
}
.form-switch .slider::before {
  content: ''; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px;
  background: var(--text-primary); border-radius: 50%; transition: var(--transition);
}
.form-switch input:checked + .slider { background: var(--blue); }
.form-switch input:checked + .slider::before { transform: translateX(18px); }

.btn {
  font-family: inherit; font-size: 13px; padding: 7px 14px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary);
  cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-hover); }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.danger:hover { background: var(--red-bg); }
.btn.small { padding: 4px 10px; font-size: 12px; }

.tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
  background: var(--bg-tertiary); color: var(--text-secondary); font-family: var(--font-mono);
}
.tag.green { background: var(--green-bg); color: var(--green); }
.tag.blue { background: var(--blue-bg); color: var(--blue); }
.tag.red { background: var(--red-bg); color: var(--red); }

/* Channel 列表 */
.channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.channel-card {
  padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--bg-secondary); transition: var(--transition);
}
.channel-card .ch-name { font-size: 13px; font-weight: 600; }
.channel-card .ch-status { margin-top: 6px; }

/* ============================================================================
   通用组件
   ============================================================================ */
.view-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border-light);
  font-size: 16px; font-weight: 600;
}
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-tertiary); gap: 8px;
}
.empty-state .empty-icon { font-size: 48px; }
.empty-state .empty-text { font-size: 14px; }

/* ============================================================================
   响应式（< 768px）
   ============================================================================ */
@media (max-width: 768px) {
  #app.active { grid-template-columns: 1fr; }
  .icon-sidebar {
    display: none;
  }
  .session-panel { width: 200px; min-width: 200px; }
  .stat-grid { grid-template-columns: 1fr; }
  .dashboard-row { flex-direction: column; }
  .msg { max-width: 92%; }
  .rooms-panel, .skills-panel, .tools-panel { width: 160px; min-width: 160px; }
}

/* ============================================================================
   下拉菜单通用
   ============================================================================ */
.dropdown-overlay {
  display: none; position: fixed; inset: 0; z-index: 40;
}
.dropdown-overlay.open { display: block; }

@media (max-width: 768px) {
  #mobile-menu-btn { display: flex !important; }
  .icon-sidebar { display: none; }
  .icon-sidebar.open { display: flex; position: fixed; left: 0; top: 0; bottom: 0; z-index: 1000; background: var(--bg-sidebar); }
}
</style>
</head>
<body>

<!-- ===========================================================================
     登录页
     =========================================================================== -->
<div id="login-page" class="active">
  <div class="login-card">
    <h1>quark-agent</h1>
    <p class="login-sub" id="login-sub"></p>
    <input type="text" class="login-field" id="login-username" placeholder="" autocomplete="username">
    <input type="password" class="login-field" id="login-password" placeholder="" autocomplete="current-password">
    <button class="login-btn" id="login-btn"></button>
    <p class="login-hint" id="login-hint"></p>
    <p class="login-error" id="login-error"></p>
    <p class="login-toggle" id="login-toggle"></p>
  </div>
</div>

<!-- ===========================================================================
     主应用
     =========================================================================== -->
<div id="app">
  <!-- 顶栏 -->
  <div class="topbar">
    <span class="brand">◉ quark-agent</span>
    <button id="mobile-menu-btn" class="icon-btn" style="display:none" onclick="toggleMobileMenu()">☰</button>
    <div class="spacer"></div>
    <select class="model-selector" id="model-selector"></select>
    <button class="locale-btn" id="locale-btn"></button>
    <div class="user-menu">
      <div class="user-avatar" id="user-avatar"></div>
      <div class="user-dropdown" id="user-dropdown">
        <div class="user-dropdown-item" id="user-profile"></div>
        <div class="user-dropdown-item" id="user-logout" style="color:var(--red)"></div>
      </div>
    </div>
    <div class="dropdown-overlay" id="user-dropdown-overlay"></div>
  </div>

  <!-- 图标侧边栏 -->
  <div class="icon-sidebar" id="icon-sidebar">

      🏠<span class="tooltip" data-i18n="sidebar.dashboard"></span>

      👥<span class="tooltip" data-i18n="sidebar.rooms"></span>
    </div>
    <div class="icon-nav-item" data-page="skills">
      🧠<span class="tooltip" data-i18n="sidebar.skills"></span>
    </div>

      🔧<span class="tooltip" data-i18n="sidebar.tools"></span>

    <div class="icon-nav-item" data-page="settings">
      ⚙️<span class="tooltip" data-i18n="sidebar.settings"></span>
    </div>
    <div class="icon-sidebar-spacer"></div>
    <div class="icon-sidebar-version">v0.1</div>
  </div>

  <!-- 主内容区 -->
  <div class="main-content">
    <!-- ================================================================
         页面 1: Chat
         ================================================================ -->
    <div class="view active" id="view-chat">
      <div class="chat-layout">

        <div class="session-panel" id="session-panel">

          <div class="chat-messages" id="chat-messages">

              <span class="empty-icon">💬</span>

          </div>
          <div class="chat-input-area">
            <div class="chat-attachments-preview" id="chat-attachments-preview"></div>
            <div class="chat-input-row">
              <input type="file" id="chat-file-input" multiple accept="image/*,application/pdf,text/*,.md,.txt,.json,.csv,audio/*" hidden>
              <button class="chat-upload-btn" id="chat-upload-btn" title="上传图片/文件">📎</button>
              <textarea class="chat-input" id="chat-input" rows="1" placeholder=""></textarea>
              <button class="chat-send-btn" id="chat-send-btn"><span data-i18n="chat.sendMessage"></span> ↑</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================================================================
         页面 2: Dashboard
         ================================================================ -->
    <div class="view" id="view-dashboard">
      <div class="dashboard-body" id="dashboard-body">

        <div class="stat-grid">

            <div class="stat-sub" id="stat-cost-today"></div>

          <div class="stat-card">
            <div class="stat-icon">🔢</div>
            <div class="stat-value" id="stat-tokens">0</div>

            <div class="stat-sub" id="stat-tokens-today"></div>

          <div class="chart-card">
            <div class="chart-title" data-i18n="dashboard.usage"></div>

          <div class="room-messages" id="room-messages">
            <div class="empty-state">
              <span class="empty-icon">👥</span>
              <span class="empty-text" data-i18n="rooms.createRoom"></span>

        <div class="accordion" id="acc-provider">
          <div class="accordion-header" onclick="toggleAccordion('acc-provider')">

/** 翻译函数 */
function t(key) {
  const locale = state.locale || 'zh';
  const parts = key.split('.');
  let obj = i18n[locale];
  for (const p of parts) { obj = obj?.[p]; }
  return obj || key;
}

/** 带 Auth 的 fetch */
async function fetchWithAuth(url, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401) {
    showLogin();
    throw new Error('Unauthorized');
  }
  return res;
}

/** 读取 JSON 响应 */
async function resJSON(res) {
  try { return await res.json(); } catch { return null; }
}

/** 简易 Markdown 渲染 */
function renderMD(text) {
  if (!text) return '';
  let html = text
    // 代码块
    .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${esc(code.trim())}</code></pre>`)
    // 行内代码
    .replace(/`([^`]+)`/g, (_, code) => '<code>'+esc(code)+'</code>')
    // 粗体
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // 斜体
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // 链接
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, url) => {
      var safe = /^(https?:|\/)/.test(url) ? url : '#';
      return '<a href="'+esc(safe)+'" target="_blank" style="color:var(--blue)">'+esc(text)+'</a>';
    })
    // 换行
    .replace(/\n/g, '<br>');
  return html;
}

/** HTML 转义 */
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/** 格式化时间 */
function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString('zh', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

/** 分组：Today / Yesterday / Earlier */
function groupSessions(sessions) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const yesterday = today - 86400000;
  const groups = { today: [], yesterday: [], earlier: [] };
  for (const s of sessions) {
    if (s.updatedAt >= today) groups.today.push(s);
    else if (s.updatedAt >= yesterday) groups.yesterday.push(s);
    else groups.earlier.push(s);
  }
  return groups;
}

function switchPage(page) {
  state.activePage = page;
  localStorage.setItem('qa-page', page);
  // 更新图标侧边栏高亮
  document.querySelectorAll('.icon-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  // 切换 view
  document.querySelectorAll('.view').forEach(el => {
    el.classList.toggle('active', el.id === `view-${page}`);
  });
  // 页面初始化
  if (page === 'dashboard') loadDashboard();
  if (page === 'rooms') loadRooms();
  if (page === 'skills') loadSkills();
  if (page === 'tools') renderToolsPanel('screenshot');
  if (page === 'settings') loadSettings();
}

// ============================================================================
// 登录流程
// ============================================================================
function showLogin() {
  state.token = '';
  localStorage.removeItem('qa-token');
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-page').classList.add('active');
  document.getElementById('app').classList.remove('active');
  updateLoginUI();
}

function hideLogin() {
  document.getElementById('login-page').classList.remove('active');
  document.getElementById('app').classList.add('active');
}

function updateLoginUI() {
  const isLogin = state.isLoginMode;
  document.getElementById('login-sub').textContent = isLogin ? t('auth.welcome') : t('auth.registerTitle');
  document.getElementById('login-username').placeholder = t('auth.username');
  document.getElementById('login-password').placeholder = t('auth.password');
  document.getElementById('login-btn').textContent = isLogin ? t('auth.login') : t('auth.register');
  document.getElementById('login-hint').textContent = isLogin ? t('auth.defaultHint') : '';
  document.getElementById('login-toggle').textContent = isLogin ? t('auth.noAccount') : t('auth.hasAccount');
  document.getElementById('login-error').classList.remove('show');
}

async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value.trim();
  if (!username || !password) return;
  const errEl = document.getElementById('login-error');
  try {
    const endpoint = state.isLoginMode ? '/api/auth/login' : '/api/auth/register';
    const res = await fetch(endpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || t('common.error');
      errEl.classList.add('show');
      return;
    }
    state.token = data.token;
    state.user = data.user;
    localStorage.setItem('qa-token', data.token);
    hideLogin();
    await initApp();
  } catch (e) {
    errEl.textContent = e.message || t('common.error');
    errEl.classList.add('show');
  }
}

async function checkAuth() {
  if (!state.token) { showLogin(); return; }
  try {
    const res = await fetchWithAuth('/api/auth/me');
    const data = await res.json();
    if (data.user) {
      state.user = data.user;
      hideLogin();
      await initApp();
    } else {
      showLogin();
    }
  } catch(e) {
    console.error('Auth check failed:', e);
    showLogin();
  }
}

// ============================================================================
// 应用初始化
// ============================================================================
async function initApp() {
  // 用户头像
  if (state.user) {
    document.getElementById('user-avatar').textContent = (state.user.username || 'U')[0].toUpperCase();
  }
  // 加载模型列表
  await loadModels();
  // 加载会话列表
  await loadSessions();
  // 切换到上次页面
  switchPage(state.activePage);
}

// ============================================================================
// 模型选择器
// ============================================================================
async function loadModels() {
  try {
    const res = await fetchWithAuth('/api/models');
    const models = await res.json();
    state.models = Array.isArray(models) ? models : [];
    const sel = document.getElementById('model-selector');
    sel.innerHTML = '';
    for (const m of state.models) {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name || m.modelId || m.id;
      sel.appendChild(opt);
    }
    // 加载当前激活模型
    try {
      const res2 = await fetchWithAuth('/api/models/active');
      const active = await res2.json();
      if (active && active.id) {
        sel.value = active.id;
        state.activeModel = active;
      }
    } catch(e) { console.error('Failed to load active model:', e); }
    // 如果没有模型，从配置加载
    if (state.models.length === 0) {
      try {
        const res3 = await fetchWithAuth('/api/config');
        const cfg = await res3.json();
        state.config = cfg;
        const opt = document.createElement('option');
        opt.value = 'default';
        opt.textContent = cfg.model || 'gpt-4o-mini';
        sel.appendChild(opt);
        sel.value = 'default';
      } catch(e) { console.error('Failed to load models:', e); }
    }
    updateModelBadge();
  } catch(e) { console.error('Failed to load models:', e); }
}

async function switchModel(id) {
  if (id === 'default') return;
  try {
    await fetchWithAuth('/api/models/switch', {
      method: 'POST',
      body: JSON.stringify({ id })
    });
    updateModelBadge();
  } catch(e) { console.error('Failed to switch model:', e); }
}

function updateModelBadge() {
  const sel = document.getElementById('model-selector');
  const badge = document.getElementById('chat-model-badge');
  badge.textContent = sel.options[sel.selectedIndex]?.textContent || sel.value;
}

// ============================================================================
// Chat - Session 管理
// ============================================================================
async function loadSessions() {
  try {
    const res = await fetchWithAuth('/api/sessions');
    state.sessions = await res.json();
    renderSessionList();
  } catch(e) { console.error('Failed to load sessions:', e);
    state.sessions = [];
    renderSessionList();
  }
}

function renderSessionList() {
  const container = document.getElementById('session-list');
  if (!state.sessions.length) {
    container.innerHTML = `<div class="empty-state" style="padding:20px"><span class="empty-text">${t('chat.noSessions')}</span></div>`;
    return;
  }
  const groups = groupSessions(state.sessions);
  let html = '';
  if (groups.today.length) {
    html += `<div class="session-group-label">${t('dashboard.today')}</div>`;
    for (const s of groups.today) html += renderSessionItem(s);
  }
  if (groups.yesterday.length) {
    html += `<div class="session-group-label">${t('dashboard.yesterday')}</div>`;
    for (const s of groups.yesterday) html += renderSessionItem(s);
  }
  if (groups.earlier.length) {
    html += `<div class="session-group-label">${t('dashboard.earlier')}</div>`;
    for (const s of groups.earlier) html += renderSessionItem(s);
  }
  container.innerHTML = html;
}

function renderSessionItem(s) {
  const active = s.id === state.currentSessionId ? 'active' : '';
  const preview = s.messageCount > 0 ? `${s.messageCount} msgs` : '';
  return `<div class="session-item ${active}" data-sid="${s.id}" onclick="selectSession('${s.id}')">
    <div class="s-info">
      <div class="s-title">${esc(s.name)}</div>
      <div class="s-preview">${preview}</div>
    </div>
    <div class="s-actions">
      <button class="s-action-btn" onclick="event.stopPropagation();renameSession('${s.id}')" title="${t('chat.renameSession')}">✏️</button>
      <button class="s-action-btn" onclick="event.stopPropagation();deleteSession('${s.id}')" title="${t('chat.deleteSession')}">🗑</button>
    </div>
  </div>`;
}

async function selectSession(id) {
  state.currentSessionId = id;
  renderSessionList();
  // 加载消息
  try {
    const res = await fetchWithAuth(`/api/sessions/${id}/messages`);
    state.currentSessionMessages = await res.json();
    renderMessages();
  } catch(e) {
    console.error('Failed to load session messages:', e);
    state.currentSessionMessages = [];
    renderMessages();
  }
}

async function createSession() {
  try {
    const res = await fetchWithAuth('/api/sessions', {
      method: 'POST',
      body: JSON.stringify({})
    });
    const s = await res.json();
    state.sessions.unshift(s);
    renderSessionList();
    await selectSession(s.id);
  } catch(e) {
    console.error('Failed to create session:', e);
    alert(t('common.error'));
  }
}

async function deleteSession(id) {
  if (!confirm(t('chat.deleteSession') + '?')) return;
  try {
    await fetchWithAuth(`/api/sessions/${id}`, { method: 'DELETE' });
    state.sessions = state.sessions.filter(s => s.id !== id);
    if (state.currentSessionId === id) {
      state.currentSessionId = null;
      state.currentSessionMessages = [];
      renderMessages();
    }
    renderSessionList();
  } catch(e) { console.error('Failed to delete session:', e); }
}

async function renameSession(id) {
  const newTitle = prompt(t('chat.renameSession'));
  if (!newTitle) return;
  try {
    await fetchWithAuth(`/api/sessions/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ name: newTitle })
    });
    const s = state.sessions.find(s => s.id === id);
    if (s) s.name = newTitle;
    renderSessionList();
  } catch(e) { console.error('Failed to rename session:', e); }
}

// ============================================================================
// Chat - 消息渲染
// ============================================================================
function renderMessages() {
  const container = document.getElementById('chat-messages');
  if (!state.currentSessionMessages.length) {
    container.innerHTML = `<div class="empty-state"><span class="empty-icon">💬</span><span class="empty-text">${t('chat.noSessions')}</span></div>`;
    return;
  }
  let html = '';
  for (const m of state.currentSessionMessages) {
    if (m.role === 'user') {
      let attHtml = '';
      if (m.attachments && m.attachments.length) {
        attHtml = '<div class="msg-attachments">' + m.attachments.map(renderAttachmentChip).join('') + '</div>';
      }
      html += `<div class="msg user"><div class="msg-role">You</div><div class="msg-content">${esc(m.content)}${attHtml}</div></div>`;
    } else {
      html += `<div class="msg agent"><div class="msg-role">Agent</div><div class="msg-content">${renderMD(m.content)}</div></div>`;
    }
  }
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

/** 追加流式消息 */
function appendStreamMessage(role, content) {
  const container = document.getElementById('chat-messages');
  // 清除空状态
  const empty = container.querySelector('.empty-state');
  if (empty) empty.remove();
  // 查找或创建当前消息气泡
  let msgEl = container.querySelector(`.msg.${role}.streaming`);
  if (!msgEl) {
    msgEl = document.createElement('div');
    msgEl.className = `msg ${role} streaming`;
    msgEl.innerHTML = `<div class="msg-role">${role === 'user' ? 'You' : 'Agent'}</div><div class="msg-content"></div>`;
    container.appendChild(msgEl);
  }
  msgEl.querySelector('.msg-content').innerHTML = role === 'user' ? esc(content) : renderMD(content);
  container.scrollTop = container.scrollHeight;
}

function finalizeStreamMessage() {
  const container = document.getElementById('chat-messages');
  const msgEl = container.querySelector('.msg.agent.streaming');
  if (msgEl) msgEl.classList.remove('streaming');
}


// ============================================================================
// Chat - 附件 / 多模态上传
// ============================================================================
let __scrollScheduled = false;
/** 平滑滚动聊天容器到底部（按帧合并，避免高频 token 抖动） */
function scrollChatSmooth() {
  if (__scrollScheduled) return;
  __scrollScheduled = true;
  requestAnimationFrame(() => {
    const container = document.getElementById('chat-messages');
    if (container) container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
    __scrollScheduled = false;
  });
}

function attachmentIcon(type) { return type === 'image' ? '🖼️' : type === 'audio' ? '🎵' : '📄'; }
function formatSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'KB';
  return (n / 1024 / 1024).toFixed(1) + 'MB';
}

/** 渲染单个附件 chip（用于消息气泡内） */
function renderAttachmentChip(att) {
  if (att.type === 'image' && att.dataUrl) {
    return `<div class="chat-attachment-thumb"><img src="${att.dataUrl}" alt="${esc(att.filename)}"><span class="att-name">${esc(att.filename)}</span></div>`;
  }
  return `<div class="chat-attachment-chip"><span class="att-icon">${attachmentIcon(att.type)}</span><span class="att-name">${esc(att.filename)}</span><span class="att-size">${formatSize(att.size)}</span></div>`;
}

/** 追加用户消息（含附件） */
function appendUserMessage(text, attachments) {
  const container = document.getElementById('chat-messages');
  const empty = container.querySelector('.empty-state');
  if (empty) empty.remove();
  const msgEl = document.createElement('div');
  msgEl.className = 'msg user';
  let attHtml = '';
  if (attachments && attachments.length) {
    attHtml = '<div class="msg-attachments">' + attachments.map(renderAttachmentChip).join('') + '</div>';
  }
  msgEl.innerHTML = `<div class="msg-role">You</div><div class="msg-content">${esc(text)}${attHtml}</div>`;
  container.appendChild(msgEl);
  scrollChatSmooth();
}

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function uploadFile(file) {
  const fd = new FormData();
  fd.append('file', file);
  const headers = {};
  if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
  // 不设置 Content-Type，让浏览器自动加上 multipart boundary
  const res = await fetch('/api/upload', { method: 'POST', headers, body: fd });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    throw new Error(d.error || '上传失败');
  }
  return await res.json();
}

async function handleFileSelect(files) {
  if (!files || !files.length) return;
  for (const file of files) {
    if (file.size > 10 * 1024 * 1024) {
      alert(`${file.name} 超过 10MB 限制`);
      continue;
    }
    try {
      const r = await uploadFile(file);
      if (r && r.attachment) {
        const att = r.attachment;
        if (att.type === 'image') att.dataUrl = await readAsDataUrl(file);
        state.pendingAttachments.push(att);
      }
    } catch (e) {
      alert(`上传 ${file.name} 失败: ${e.message}`);
    }
  }
  renderPendingAttachments();
}

function renderPendingAttachments() {
  const c = document.getElementById('chat-attachments-preview');
  if (!c) return;
  if (!state.pendingAttachments.length) { c.innerHTML = ''; c.style.display = 'none'; return; }
  c.style.display = 'flex';
  c.innerHTML = state.pendingAttachments.map((att, i) => {
    const idx = `data-idx="${i}"`;
    if (att.type === 'image' && att.dataUrl) {
      return `<div class="chat-attachment-thumb pending"><img src="${att.dataUrl}" alt="${esc(att.filename)}"><button class="att-remove" ${idx}>×</button><span class="att-name">${esc(att.filename)}</span></div>`;
    }
    return `<div class="chat-attachment-chip pending"><span class="att-icon">${attachmentIcon(att.type)}</span><span class="att-name">${esc(att.filename)}</span><span class="att-size">${formatSize(att.size)}</span><button class="att-remove" ${idx}>×</button></div>`;
  }).join('');
}
// ============================================================================
// Chat - 发送消息（SSE 流式，token-by-token）
// ============================================================================
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  const attachments = state.pendingAttachments.slice();
  if ((!text && !attachments.length) || state.isStreaming) return;

  // 如果没有会话，先创建
  if (!state.currentSessionId) {
    await createSession();
    if (!state.currentSessionId) return;
  }

  input.value = '';
  input.style.height = 'auto';
  state.isStreaming = true;
  document.getElementById('chat-send-btn').disabled = true;
  document.getElementById('chat-upload-btn').disabled = true;
  // 清空待发附件预览
  state.pendingAttachments = [];
  renderPendingAttachments();

  // 显示用户消息（含附件）
  appendUserMessage(text, attachments);
  state.currentSessionMessages.push({ role: 'user', content: text, attachments, ts: Date.now() });

  // 显示 typing 动画
  const container = document.getElementById('chat-messages');
  const typingEl = document.createElement('div');
  typingEl.className = 'msg agent streaming';
  typingEl.innerHTML = `<div class="msg-role">Agent</div><div class="msg-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  container.appendChild(typingEl);
  scrollChatSmooth();

  let fullReply = '';
  let agentEl = null;
  let toolEl = null;

  // 用 agentEl 替换 typing 气泡，按 token 增量渲染
  const ensureAgentBubble = () => {
    if (agentEl) return agentEl;
    if (typingEl.parentNode) typingEl.remove();
    agentEl = document.createElement('div');
    agentEl.className = 'msg agent streaming';
    agentEl.innerHTML = `<div class="msg-role">Agent</div><div class="msg-content"></div>`;
    container.appendChild(agentEl);
    return agentEl;
  };
  const updateAgentContent = () => {
    if (!agentEl) return;
    agentEl.querySelector('.msg-content').innerHTML = renderMD(fullReply) + '<span class="stream-cursor"></span>';
    scrollChatSmooth();
  };

  try {
    // 使用 SSE 流式接口
    const url = `/api/sessions/${state.currentSessionId}/chat`;
    const res = await fetchWithAuth(url, {
      method: 'POST',
      body: JSON.stringify({ text, attachments })
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Request failed');
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    const handleEvent = (eventType, dataStr) => {
      let data;
      try { data = JSON.parse(dataStr); } catch { return; }
      if (eventType === 'done') {
        if (data.reply) fullReply = data.reply;
      } else if (eventType === 'error') {
        fullReply = `❌ ${data.error || '未知错误'}`;
      } else if (eventType === 'chunk' || eventType === 'token') {
        // 增量 token：data 可能是 {delta} 或嵌套在 data 字段里
        const delta = (data.data && data.data.delta) || data.delta || data.token || '';
        if (delta) {
          ensureAgentBubble();
          fullReply += delta;
          updateAgentContent();
        }
      } else if (eventType === 'tool_call' || eventType === 'tool_start') {
        const tool = (data.data && data.data.tool) || data.tool || 'tool';
        ensureAgentBubble();
        toolEl = document.createElement('div');
        toolEl.className = 'tool-progress';
        toolEl.innerHTML = `<span class="tool-icon">🔧</span><span class="tool-name">${esc(tool)}</span><span class="tool-status">执行中…</span>`;
        agentEl.querySelector('.msg-content').appendChild(toolEl);
        scrollChatSmooth();
      } else if (eventType === 'tool_result' || eventType === 'tool_end') {
        if (toolEl) {
          toolEl.querySelector('.tool-status').textContent = '完成';
          toolEl.classList.add('done');
          toolEl = null;
        }
      } else if (eventType === 'run_start' || eventType === 'connected') {
        // 仍显示 typing 动画，等待首个 chunk
      }
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      // SSE 事件以空行分隔；保留不完整尾部在 buffer 中
      const events = buffer.split('\n\n');
      buffer = events.pop() ?? '';
      for (const evt of events) {
        if (!evt.trim()) continue;
        let eventType = '';
        const dataLines = [];
        for (const line of evt.split('\n')) {
          if (line.startsWith('event:')) eventType = line.slice(6).trim();
          else if (line.startsWith('data:')) dataLines.push(line.slice(5).replace(/^ /, ''));
          else if (line.startsWith(':')) continue; // SSE 注释
        }
        if (eventType && dataLines.length) handleEvent(eventType, dataLines.join('\n'));
      }
    }
    // 处理缓冲区中残留的最后一个事件
    if (buffer.trim()) {
      let eventType = '';
      const dataLines = [];
      for (const line of buffer.split('\n')) {
        if (line.startsWith('event:')) eventType = line.slice(6).trim();
        else if (line.startsWith('data:')) dataLines.push(line.slice(5).replace(/^ /, ''));
      }
      if (eventType && dataLines.length) handleEvent(eventType, dataLines.join('\n'));
    }

    // 如果没有任何流式数据，尝试按普通 JSON 响应解析
    if (!fullReply) {
      try {
        const data = await resJSON(res);
        fullReply = data?.reply || '';
      } catch (e) { console.error('Error:', e); }
    }
  } catch (e) {
    fullReply = `❌ ${e.message}`;
  }

  // 收尾：移除 typing、定稿 agent 气泡
  if (typingEl.parentNode) typingEl.remove();
  if (agentEl) {
    agentEl.querySelector('.msg-content').innerHTML = renderMD(fullReply);
  } else if (fullReply) {
    appendStreamMessage('agent', fullReply);
  }
  if (fullReply) {
    state.currentSessionMessages.push({ role: 'assistant', content: fullReply, ts: Date.now() });
  }

  state.isStreaming = false;
  document.getElementById('chat-send-btn').disabled = false;
  document.getElementById('chat-upload-btn').disabled = false;
  finalizeStreamMessage();
}

async function loadDashboard() {
  // 加载用量统计
  try {
    const res = await fetchWithAuth('/api/analytics/usage');
    const usage = await res.json();
    document.getElementById('stat-sessions').textContent = usage.totalSessions || 0;
    document.getElementById('stat-cost').textContent = '$' + (usage.totalCost || 0).toFixed(2);
    const totalTokens = (usage.totalInputTokens || 0) + (usage.totalOutputTokens || 0);
    document.getElementById('stat-tokens').textContent = totalTokens > 1000 ? (totalTokens / 1000).toFixed(1) + 'K' : totalTokens;
  } catch(e) { console.error('Dashboard load error:', e); }

  // 加载趋势
  try {
    const res = await fetchWithAuth('/api/analytics/trend?days=7');
    const trend = await res.json();
    renderBarChart(trend);
  } catch(e) { console.error('Dashboard load error:', e); }

  // 加载模型分布
  try {
    const res = await fetchWithAuth('/api/analytics/models');
    const models = await res.json();
    renderModelPie(models);
  } catch(e) { console.error('Dashboard load error:', e); }

  // 加载 Traces
  try {
    const res = await fetchWithAuth('/api/trace');
    const traces = await res.json();
    renderTraces(traces);
  } catch(e) { console.error('Dashboard load error:', e); }

  // 加载 Logs
  try {
    const res = await fetchWithAuth('/api/logs?limit=20');
    const data = await res.json();
    renderLogs(data.entries || data);
  } catch(e) { console.error('Dashboard load error:', e); }
}

function renderBarChart(trend) {
  const container = document.getElementById('usage-chart');
  if (!trend || !trend.length) { container.innerHTML = '<div style="color:var(--text-tertiary);font-size:12px">No data</div>'; return; }
  const max = Math.max(...trend.map(t => (t.input || 0) + (t.output || 0)), 1);
  container.innerHTML = trend.map(t => {
    const total = ((t.input || 0) + (t.output || 0));
    const h = Math.max(4, (total / max) * 80);
    const label = (t.date || '').slice(-5);
    return `<div class="bar" style="height:${h}px"><span class="bar-label">${label}</span></div>`;
  }).join('');
}

const PIE_COLORS = ['#60a5fa','#a78bfa','#4ade80','#fb923c','#f87171','#facc15'];
function renderModelPie(models) {
  const container = document.getElementById('model-pie');
  const entries = Object.entries(models);
  if (!entries.length) { container.innerHTML = '<div style="color:var(--text-tertiary);font-size:12px">No data</div>'; return; }
  container.innerHTML = entries.map(([name, count], i) =>
    `<div class="pie-legend-item"><div class="pie-legend-color" style="background:${PIE_COLORS[i % PIE_COLORS.length]}"></div>${esc(name)} (${count})</div>`
  ).join('');
}

function renderTraces(traces) {
  const container = document.getElementById('trace-list');
  if (!traces || !traces.length) { container.innerHTML = '<div style="color:var(--text-tertiary);font-size:12px">No traces</div>'; return; }
  container.innerHTML = traces.slice(0, 10).map(t =>
    `<div class="trace-item">
      <span class="trace-status">${t.status === 'ok' || t.status === 'done' ? '✓' : t.error ? '✗' : '○'}</span>
      <span class="trace-id">${esc(t.name || t.id || '')}</span>
      <span class="trace-spans">${t.spanCount || t.children?.length || 0} spans</span>
      <span class="trace-dur">${t.durationMs ? (t.durationMs / 1000).toFixed(1) + 's' : ''}</span>
    </div>`
  ).join('');
}

function renderLogs(logs) {
  const container = document.getElementById('dashboard-logs');
  if (!logs || !logs.length) { container.innerHTML = '<div style="color:var(--text-tertiary);font-size:12px">No logs</div>'; return; }
  container.innerHTML = logs.slice(0, 20).map(l =>
    `<div class="log-entry">
      <span class="log-level ${l.level || 'info'}">${l.level || 'info'}</span>
      <span class="log-ts">${l.timestamp ? fmtTime(l.timestamp) : ''}</span>
      <span class="log-msg">${esc(l.message || l.msg || '')}</span>
    </div>`
  ).join('');
}

async function selectRoom(id) {
  state.currentRoomId = id;
  renderRoomList();

async function loadRoomMessages(id) {
  try {
    const res = await fetchWithAuth(`/api/chatrooms/${id}/messages?limit=50`);

    renderRoomMessages(messages);
  } catch(e) { console.error('Failed to load room messages:', e);

function renderRoomMessages(messages) {
  const container = document.getElementById('room-messages');

async function createRoom() {

      method: 'POST',
      body: JSON.stringify({ name })

async function sendRoomMessage() {
  const input = document.getElementById('room-input');

    </div>
    ${skill.env ? `<div class="form-group"><div class="form-label">${t('skills.env')}</div><div>${Object.entries(skill.env).map(([k,v]) => `<span class="tag">${esc(k)}</span> `).join('')}</div></div>` : ''}

    if (data.data) {

function applyI18n() {
  // 更新所有 data-i18n 元素
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  // 更新 placeholder
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  // 语言按钮
  document.getElementById('locale-btn').textContent = state.locale === 'zh' ? '🌐 中' : '🌐 EN';
  // 登录页
  updateLoginUI();
  // Chat placeholder
  document.getElementById('chat-input').placeholder = t('chat.typePlaceholder');
  // Room placeholder
  const roomInput = document.getElementById('room-input');
  if (roomInput) roomInput.placeholder = t('rooms.typePlaceholder');
  // 重新渲染 session 列表
  if (state.sessions.length) renderSessionList();
}

  const sidebar = document.querySelector('.icon-sidebar');
  if (sidebar) sidebar.classList.toggle('open');
}

// ============================================================================
// 事件绑定
// ============================================================================
function bindEvents() {
  // 登录按钮
  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('login-toggle').addEventListener('click', () => {
    state.isLoginMode = !state.isLoginMode;
    updateLoginUI();
  });

  // 侧边栏导航
  document.querySelectorAll('.icon-nav-item').forEach(el => {
    el.addEventListener('click', () => switchPage(el.dataset.page));
  });

  // 语言切换
  document.getElementById('locale-btn').addEventListener('click', () => {
    state.locale = state.locale === 'zh' ? 'en' : 'zh';
    localStorage.setItem('qa-locale', state.locale);
    applyI18n();
  });

  // 模型切换
  document.getElementById('model-selector').addEventListener('change', e => {
    switchModel(e.target.value);
  });

  // 用户菜单
  document.getElementById('user-avatar').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('user-dropdown').classList.toggle('open');
    document.getElementById('user-dropdown-overlay').classList.toggle('open');
  });
  document.getElementById('user-dropdown-overlay').addEventListener('click', () => {
    document.getElementById('user-dropdown').classList.remove('open');
    document.getElementById('user-dropdown-overlay').classList.remove('open');
  });
  document.getElementById('user-logout').addEventListener('click', () => {
    showLogin();
  });

  // 新建会话
  document.getElementById('new-chat-btn').addEventListener('click', createSession);

  // 折叠/展开 Session 面板
  document.getElementById('toggle-session-btn').addEventListener('click', () => {
    const panel = document.getElementById('session-panel');
    panel.classList.toggle('collapsed');
    const btn = document.getElementById('toggle-session-btn');
    btn.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
  });

  // 发送消息
  document.getElementById('chat-send-btn').addEventListener('click', sendMessage);
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  // 多模态上传：按钮触发文件选择
  document.getElementById('chat-upload-btn').addEventListener('click', () => {
    document.getElementById('chat-file-input').click();
  });
  document.getElementById('chat-file-input').addEventListener('change', function() {
    handleFileSelect(this.files);
    this.value = '';
  });
  // 粘贴图片自动上传
  document.getElementById('chat-input').addEventListener('paste', e => {
    const items = e.clipboardData?.items || [];
    const files = [];
    for (const it of items) {
      if (it.kind === 'file') { const f = it.getAsFile(); if (f) files.push(f); }
    }
    if (files.length) { e.preventDefault(); handleFileSelect(files); }
  });
  // 拖拽上传
  const chatInputArea = document.querySelector('.chat-input-area');
  if (chatInputArea) {
    chatInputArea.addEventListener('dragover', e => { e.preventDefault(); chatInputArea.classList.add('drag-over'); });
    chatInputArea.addEventListener('dragleave', () => chatInputArea.classList.remove('drag-over'));
    chatInputArea.addEventListener('drop', e => {
      e.preventDefault(); chatInputArea.classList.remove('drag-over');
      handleFileSelect(e.dataTransfer?.files);
    });
  }
  // 附件移除（事件委托）
  document.getElementById('chat-attachments-preview').addEventListener('click', e => {
    const btn = e.target.closest('.att-remove');
    if (!btn) return;
    const idx = parseInt(btn.dataset.idx, 10);
    if (!isNaN(idx)) { state.pendingAttachments.splice(idx, 1); renderPendingAttachments(); }
  });
  // 自动调整高度
  document.getElementById('chat-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
  });

  // 新建房间
  document.getElementById('new-room-btn').addEventListener('click', createRoom);
  // 房间发送消息
  document.getElementById('room-send-btn').addEventListener('click', sendRoomMessage);
  document.getElementById('room-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendRoomMessage(); }
  });

  // Skills 搜索
  document.getElementById('skills-search').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    document.querySelectorAll('.skill-item').forEach(el => {
      el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
  // Install Skill
  document.getElementById('install-skill-btn').addEventListener('click', installSkill);

  // Tools 面板导航
  document.querySelectorAll('.tool-action-item').forEach(el => {
    el.addEventListener('click', () => renderToolsPanel(el.dataset.tool));
  });

  // Room Ask Agent
  document.getElementById('room-ask-btn').addEventListener('click', async () => {
    if (!state.currentRoomId) return;
    try {
      await fetchWithAuth(`/api/chatrooms/${state.currentRoomId}/ask`, {
        method: 'POST',
        body: JSON.stringify({ messageId: 'latest' })
      });
      await loadRoomMessages(state.currentRoomId);
    } catch(e) { console.error('Error:', e); }
  });
}

// ============================================================================
// 启动
// ============================================================================
document.addEventListener('DOMContentLoaded', () => {
  bindEvents();
  applyI18n();
  checkAuth();
});
</script>
</body>
</html>
